# 依赖版本集中管理，避免 Media3 组件混用不同版本。
[versions]
agp = "8.13.2"
media3 = "1.9.2"
media3v110 = "1.10.1"
media3v111 = "1.11.0"
junit = "4.13.2"
gson = "2.11.0"
annotation = "1.6.0"
mavenPublish = "0.34.0"

[libraries]
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-container = { module = "androidx.media3:media3-container", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3" }
media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }
media3-database = { module = "androidx.media3:media3-database", version.ref = "media3" }
media3v110-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3v110" }
media3v110-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3v110" }
media3v110-common = { module = "androidx.media3:media3-common", version.ref = "media3v110" }
media3v110-container = { module = "androidx.media3:media3-container", version.ref = "media3v110" }
media3v110-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3v110" }
media3v110-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3v110" }
media3v110-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3v110" }
media3v110-database = { module = "androidx.media3:media3-database", version.ref = "media3v110" }
media3v111-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3v111" }
media3v111-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3v111" }
media3v111-common = { module = "androidx.media3:media3-common", version.ref = "media3v111" }
media3v111-container = { module = "androidx.media3:media3-container", version.ref = "media3v111" }
media3v111-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3v111" }
media3v111-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3v111" }
media3v111-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3v111" }
media3v111-database = { module = "androidx.media3:media3-database", version.ref = "media3v111" }
junit = { module = "junit:junit", version.ref = "junit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
