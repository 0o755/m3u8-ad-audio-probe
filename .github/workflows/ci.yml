name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tests, lint, AAR and Maven metadata
        run: ./gradlew test lintRelease assembleRelease publishToMavenLocal --no-daemon
      - name: Verify one-line external consumer
        run: ./gradlew -p consumer-smoke :consumer:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ad-audio-probe-aar
          path: probe/build/outputs/aar/probe-release.aar
